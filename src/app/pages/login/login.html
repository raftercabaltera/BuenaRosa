<div class="login-page">
  <div class="background-bubble bubble-one"></div>
  <div class="background-bubble bubble-two"></div>
  <div class="background-bubble bubble-three"></div>

  <section class="login-shell">
    <div class="brand-panel">
      <img src="images/buenarosa9-nobg.png" alt="Buena Rosa 9 Logo" class="logo" />
      <p class="eyebrow">Buena Rosa 9 HOA Portal</p>
      <h1>Sign in to your community account</h1>
      <p class="brand-copy">
        Access resident services, announcements, and subdivision records for
        Buena Rosa 9 in one secure portal.
      </p>
      <a routerLink="/" class="back-link">Back to Home</a>
    </div>

    <div class="login-card">
      <div class="role-buttons">
        <a routerLink="/dashboard" class="role-btn officer">
          <strong>Officer</strong>
        </a>

        <a routerLink="/owner-dashboard" class="role-btn owner">
          <strong>Owner</strong>
        </a>

        <a routerLink="/renter-dashboard" class="role-btn renter">
          <strong>Renter</strong>
        </a>

        <a routerLink="/guard-dashboard" class="role-btn guard">
          <strong>Guards</strong>
        </a>
      </div>
    </div>
  </section>
</div>
