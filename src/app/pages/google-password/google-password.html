<div class="google-password-page">
  <div class="background-bubble bubble-one"></div>
  <div class="background-bubble bubble-two"></div>
  <div class="background-bubble bubble-three"></div>

  <main class="auth-card">
    <section class="brand-pane">
      <div class="logo-highlight">
        <img
          class="brand-logo"
          src="images/buenarosa9-nobg.png"
          alt="Buena Rosa 9 logo"
        />
      </div>
      <p class="google-wordmark" aria-label="Buena Rosa 9">Buena Rosa 9</p>

      <h1>Welcome</h1>
      <button
        type="button"
        class="account-chip"
        routerLink="/google-login"
        aria-label="Change account"
      >
        <span class="chip-icon" aria-hidden="true"></span>
        <span class="chip-text">Blk # Lot #</span>
        <span class="chip-caret" aria-hidden="true"></span>
      </button>
    </section>

    <section class="form-pane" aria-label="Buena Rosa 9 password form">
      <label class="field" for="br9-password">
        <input
          id="br9-password"
          type="password"
          autocomplete="current-password"
          placeholder=" "
        />
        <span class="field-label">Password</span>
      </label>

      <button type="button" class="link-btn">Forgot password?</button>

      <div class="actions">
        <button type="button" class="secondary-btn" routerLink="/google-login">
          Back
        </button>
        <button type="button" class="primary-btn">Sign in</button>
      </div>
    </section>
  </main>
</div>
