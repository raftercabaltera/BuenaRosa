<div class="google-login-page">
  <div class="background-bubble bubble-one"></div>
  <div class="background-bubble bubble-two"></div>
  <div class="background-bubble bubble-three"></div>

  <main class="auth-card">
    <section class="brand-pane">
      <div class="logo-highlight">
        <img
          class="brand-logo"
          src="images/buenarosa9-nobg.png"
          alt="Buena Rosa 9 logo"
        />
      </div>
      <p class="google-wordmark" aria-label="Buena Rosa 9">Buena Rosa 9</p>

      <h1>Sign in</h1>
      <p class="subtitle">Access the Buena Rosa 9 Homeowners Portal</p>
    </section>

    <section class="form-pane" aria-label="Buena Rosa 9 login form">
      <label class="field" for="br9-account">
        <input
          id="br9-account"
          type="text"
          autocomplete="username"
          placeholder=" "
        />
        <span class="field-label">Blk # Lot #</span>
      </label>

      <div class="assist-block">
        <button type="button" class="link-btn">Forgot password?</button>

        <p class="guest-copy">
          Use your authorized homeowner, renter, or guard account to continue.
        </p>

        <button type="button" class="link-btn support-link">
          Need access? Contact the HOA office
        </button>
      </div>

      <div class="actions">
        <button type="button" class="secondary-btn" routerLink="/login">
          Back
        </button>
        <button type="button" class="primary-btn" routerLink="/google-password">
          Next
        </button>
      </div>
    </section>
  </main>
</div>
